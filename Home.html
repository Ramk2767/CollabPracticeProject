<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font-family: Arial, sans-serif; color: #1f2937; background: #f3f6fb; }
		header { padding: 18px 8%; background: #fff; display: flex; justify-content: space-between; align-items: center; }
		.brand { color: #2563eb; font-size: 1.25rem; font-weight: 700; }
		nav { display: flex; gap: 22px; }
		nav a { color: #4b5563; text-decoration: none; }
		nav a:hover { color: #2563eb; }
		main { min-height: calc(100vh - 62px); display: grid; place-items: center; padding: 32px 20px; text-align: center; }
		.welcome { max-width: 600px; }
		h1 { margin: 0 0 14px; font-size: clamp(2.5rem, 7vw, 4rem); }
		p { color: #64748b; font-size: 1.1rem; line-height: 1.6; margin: 0 0 26px; }
		.button { display: inline-block; padding: 12px 20px; border-radius: 6px; background: #2563eb; color: white; font-weight: 600; text-decoration: none; }
		.button:hover { background: #1d4ed8; }
		@media (max-width: 480px) { header { padding: 16px 5%; } nav { gap: 12px; font-size: .9rem; } }
	</style>
</head>
<body>
	<header>
		<div class="brand">My Website</div>
		<nav aria-label="Main navigation">
			<a href="#home">Home</a>
			<a href="#about">About</a>
			<a href="#contact">Contact</a>
		</nav>
	</header>
	<main id="home">
		<section class="welcome" id="about">
			<h1>Welcome home</h1>
			<p>A simple place to share what you do and help visitors find their way.</p>
			<a class="button" id="contact" href="mailto:hello@example.com">Get in touch</a>
		</section>
	</main>
</body>
</html>
